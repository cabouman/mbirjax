name: mbirjax
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - pip
  # All Python dependencies live in pyproject.toml (the single source of truth),
  # including the "docs" and "test" extras. Conda only provides Python + pip here;
  # everything else is installed editable via pip so there is one list to maintain.
  - pip:
      - -e .[docs,test]
